# ASMEM HTTP API service: /add + /search.
#
#   python -m asmem.api --config configs/api.yaml --port 8000
#
# This is configs/asmem.yaml with the generator and embedding endpoints taken
# from configs/bench.yaml, so the API does not depend on a local sglang server.
# Only add/search are served here: bench-only sections (experiment/answer/eval)
# and their dataset-specific answer styles do not apply.
#
# This file is merged on top of asmem.search.runner.DEFAULT_CONFIG.  Requests
# therefore go through exactly the same add/search implementation as
# configs/asmem.yaml and scripts/run_bench.py:
#   /add    -> api.store.UserStore.append -> schema.normalize_messages
#   /search -> search.runner.run_question -> api.server.build_search_items
# Only the generator/embedding endpoints and service limits are API-specific.
#
# The previous failure (stop=model_error:RuntimeError) happened because
# configs/asmem.yaml points generator at http://127.0.0.1:30000/v1 and no
# server was listening on that port; every postagent/verifier call failed
# after retries.

generator:
  # Remote OpenAI-compatible endpoint (same one bench.yaml uses).  The host
  # must include the `api.` prefix: http://.openlux.ai does not resolve.
  model: gpt-4o-mini
  base_url: https://api.openlux.ai/v1
  api_key: 
  temperature: 0.0
  max_tokens: 8192
  enable_thinking: false
  # Remote endpoint: read timeout is bounded (thinking is off, so a reply
  # should arrive well within a minute); fail new connections fast so the
  # retry budget is spent retrying rather than waiting on a kernel SYN timeout.
  timeout: 60
  connect_timeout: 5
  max_retries: 2

# The text JSON tool protocol from the system prompt (gpt-4o-mini also works
# with native tools, but keeping one protocol for both configs avoids drift).
native_tools: false
tools: [read, write, edit, bash]

# Resilience.  search_timeout is the whole-request wall-clock budget: when it
# expires the agent stops and the evidence written so far is returned (never a
# 5xx).  search_hard_timeout is the last-resort cap around run_question;
# shutdown_timeout drains in-flight searches before exit.
search_timeout: 300
search_hard_timeout: 600
# Queue wait is bounded separately: a request that cannot enter the search
# semaphore returns the model-free fallback instead of queueing for 10
# minutes and then returning [].
search_queue_timeout: 240
# Hard-timeout fallback.  The search writes a coarse shortlist before its
# first model call; the API returns it when the run is cancelled.  If that
# file is empty, a BM25-only pass (no generative/embedding model) runs.
fallback_enabled: true
fallback_timeout: 20
fallback_concurrency: 8
fallback_evidence_limit: 64
fallback_keep_files: false
shutdown_timeout: 20
health_stats_ttl: 10
# Consecutive transport failures that open the per-run model circuit breaker.
llm_breaker_failures: 2
# Also open a process-wide breaker so new searches fail fast into the coarse
# fallback while the endpoint is down (0 disables).
llm_global_breaker_failures: 8
llm_global_breaker_cooldown: 30
# Preflight token cap + context-overflow shrink recovery.  This keeps a long
# evidence/prompt from turning into a 400 or a long, slow generation.
model_input_token_cap: 24000
model_output_reserve_tokens: 4096
context_overflow_retries: 1
verifier_max_output_tokens: 2048
postagent_max_output_tokens: 4096
# Optional shared secret.  Empty = no auth (the competition platform may not
# send one).  When set, X-Api-Key / Authorization: Bearer|Token is required.
api_key: ""

# Postagent budget. The coarse stage seeds evidence.jsonl; six steps leave room
# for a real multi-hop chain plus curation.
max_steps: 6
max_verify_rounds: 0
no_progress_patience: 2
observation_max_chars: 6000
write_nudge_after: 2
max_empty_finish_refusals: 1
max_parse_retries: 1
repeat_limit: 1
context_max_chars: 50000
context_keep_recent: 6
agent_max_context_tokens: 32000
bash_timeout: 60

# Core method: coarse -> verifier -> two paths.
#   verifier pass  -> answer from coarse evidence
#   verifier fail  -> bounded evidence postagent loop (rewrite query, take notes)
postagent_mode: gate_loop
loop_max_steps: 3
loop_top_k: 5
loop_auto_note: 2
loop_note_chars: 1200
loop_evidence_chars: 6000
loop_item_chars: 400
loop_force_intents: []
loop_accept_answer_types: []
gate_check_consistency: true
# The permissive gate does the coarse audit; no separate pre-audit.
pre_audit: false

# Capture a --grep/--query hit the model found but did not append.
auto_capture_hits: true
auto_capture_limit: 2
auto_capture_total: 6

# Evidence budget: half agent-written, half coarse multi-channel RRF shortlist.
max_evidence: 64
coarse_evidence_ratio: 0.5
max_evidence_chars: 40000

# Precision-first verifier: it audits exactly the evidence the answer model
# would see, requires grounded claims for value questions, and checks key-term
# coverage.
verifier_max_evidence: 24
verifier_max_chars: 6000
verifier_max_context_tokens: 24000
verifier_strict: false
verifier_require_claims: false
verifier_grounding_threshold: 0.2
verifier_min_key_coverage: 0.2

max_append_per_call: 8
max_command_chars: 800
max_model_errors: 2

# Comparison `loop` only; the core gate_loop does not use mid-loop audits.
audit_after_step: 4

# Mandatory neighbourhood expansion around every cited anchor.
evidence_neighbor_window: 1
neighbor_max_chars: 600

# Final evidence is selected against the answer model's character budget.
final_evidence_chars: 40000
final_item_chars: 4000
final_parent_cap: 2
final_claim_ratio: 0.5
# Keep claims that cite a source the coarse shortlist missed; cap how many
# such claims and agent-added raw records can enter the final list.
final_claim_cap: 12
final_agent_cap: 16
save_transcript: true
save_steps: true
parent_max_chars: 4000
parent_auto_chars: 1500
parent_window_chunks: 1
window_max_chars: 4000

# Coarse recall. Dense uses the Bailian OpenAI-compatible embedding endpoint
# (identical to bench.yaml). If it is unreachable, the index logs a warning
# and falls back to BM25 + exact + time + state.
retrieval:
  mode: hybrid
  # Keep /add pure CPU: the index is built lazily on the first /search.
  index_on_add: false
  coarse:
    candidates: 80
    session_cap_ratio: 0.3
    channel_top_k: 3
    neighbor_window: 1
    neighbor_ratio: 0.2
    neighbor_max_chars: 600
    dedup_jaccard: 0.9
    rrf_k: 60
    option_view_weight: 0.3
  # Token-based chunking. `version` is part of the embedding identity, so
  # changing the thresholds invalidates the dense cache.
  chunking:
    version: 3
    message_tokens: 320
    passage_tokens: 320
    record_tokens: 320
    overlap_tokens: 40
    min_tokens: 20
    message_chars: 3000
    passage_chars: 1500
    record_chars: 2000
    overlap_chars: 120
    min_chars: 120
  channels:
    bm25: 0.5
    dense: 0.5
    exact: 0.3
    time: 0.2
    state: 0.2
    session: 0.2
    option: 0.2
  gate:
    enabled: true
    verify: false
    min_coverage: 0.6
    min_channels: 1
    max_terms: 12
    min_text_chars: 40
    evidence_limit: 12
    allow_routes: [dialogue]
  bm25:
    k1: 1.2
    b: 0.75
  dense:
    mode: "on"
    # Bailian text-embedding-v4: 1024 dims by default (allowed 64..3072),
    # at most 10 inputs per request, billed by input token.
    model: text-embedding-v4
    base_url: https://ws-dnct2qqi9s4mb64e.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key: 
    batch_size: 8
    concurrency: 8
    max_retries: 3
    # Cap a single embedding request; the search budget is above this.
    timeout: 60
    dim: 1024
    dimensions: 1024
    query_prefix: ""
    document_prefix: ""
    include_role: false
    # Long records are encoded in overlapping token windows and max-pooled.
    max_tokens: 320
    overlap_tokens: 40
    max_chars: 0
    overlap_chars: 0

# Multimodal track.  Retrieval is caption-based, not image-embedding-based:
# Add stores each inline image under <user>/images/ and keeps only a short
# [image: <id>] marker + [caption] text in memory.  Search can return the
# stored image (text ContentPart first, then image_url) within the protocol's
# 10 MiB / 30 MiB budgets.  postagent_images=auto sends a query image only to
# the gate and the first evidence-loop turn; a text-only question never
# attaches an image.
multimodal:
  enabled: true
  caption: true              # caption images that have no text/caption
  caption_query: true        # caption Search query images for retrieval
  caption_model: ""          # empty -> generator.model (must be vision-capable)
  caption_max_chars: 300
  caption_timeout: 20
  max_image_bytes: 10485760
  max_request_bytes: 31457280
  max_response_bytes: 31457280
  max_response_images: 8
  max_query_images: 1
  return_images: true
  postagent_images: auto

# API service settings.
store_dir: data/api_store
concurrency: 8           # concurrent /search runs
add_concurrency: 32      # concurrent /add requests
top_k: 100               # default cap applied when a request omits top_k

log:
  level: info
